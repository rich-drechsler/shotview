<html>
    <head>
        <title>Billiard Shot View 1.2</title>

        <style>
            /*
             * The comments in this file are primarily for programmers who are familiar with
             * JavaScript and HTML, and want to take a look at the source code. There isn't
             * much user information in the source code comments, but it is available (via a
             * Help button) when you run the application. The text displayed when that button
             * is pressed is built from a single multiline string that's assigned to a variable
             * named TABBED_HELP_DESCRIPTION. It's a very readable string and is the place to
             * go for user information when you don't want to run this application.
             *
             * The original HTML version of this application hardcoded constants wherever they
             * were needed. For example, colors were hex numbers that were used throughout the
             * application and numbers, like the min, max, and initial value of a slider, were
             * replicated everywhere. The application worked, but changing or improving it was
             * a daunting proposition that I didn't want to tackle.
             *
             * The approach taken in this version tries to centralize all of the application's
             * tunable parameters as CSS variables that are defined next in :root. All of them
             * are also copied into the window.app.CSS_GLOBALS JavaScript object when the "CSS
             * Globals Collector" module runs, so they're easy to access in any JavaScript code
             * that runs after that module. Change the value that's assigned to any of the CSS
             * variables defined in :root and that change should be reflected everywhere in the
             * application the next time it's run.
             *
             * NOTE - there likely are better approaches, but this one seemed pretty easy and
             * suitable for my purposes in this application. Handling element initialization
             * is a bit tricky, but it's described in more detail in comments that immediately
             * precede the block of variables that start with the "--initial-" prefix. Take a
             * look at the initializeElements() function for the low level details.
             */

            :root {
                /*
                 * GUI Colors
                 */

                --background-color: dimgray;
                --foreground-color: white;
                --border-color: gainsboro;
                --title-color: white;
                --empty-color: black;
                --drag-background-color: color-mix(in srgb, var(--background-color) 70%, black);

                /*
                 * Fonts
                 */

                --font-family: "Consolas", monospace;
                --font-size: 16px;
                --font-size-title: 18px;
                --font-weight: bold;

                /*
                 * Opacity
                 */

                --enabled-opacity: 1.0;
                --hidden-opacity: 0.0;
                --disabled-opacity: 0.4;

                /*
                 * Panel Settings
                 */

                --panel-padding: 4px;
                --panel-border-color: var(--border-color);
                --panel-border-width: 2px;
                --panel-border-style: solid;

                --slider-step-drag-threshold: 8;
                --slider-title-drag-threshold: 25;

                /*
                 * Help Settings
                 */

                --help-background-color: var(--background-color);
                --help-foreground-color: var(--foreground-color);

                --help-font-family: var(--font-family);
                --help-font-size: var(--font-size);
                --help-font-size-title: var(--font-size-title);
                --help-font-weight: var(--font-weight);

                --help-panel-border-color: var(--panel-border-color);
                --help-panel-border-width: var(--panel-border-width);
                --help-panel-border-style: var(--panel-border-style);

                --help-tab-foreground-color: wheat;
                --help-level-indent: 12px;
                --help-heading-margin-bottom: 3px;
                --help-heading-foreground-color: var(--help-tab-foreground-color);

                /*
                 * Three.js Settings
                 */

                --three-table-color: darkgreen;

                --three-cue-ball-color: thistle;
                --three-cue-ball-roughness: 0.2;
                --three-cue-ball-metalness: 0.1;

                --three-object-ball-color: lightskyblue;
                --three-object-ball-roughness: 0.2;
                --three-object-ball-metalness: 0.1;

                --three-ghost-ball-color: gainsboro;
                --three-ghost-ball-roughness: 0.5;
                --three-ghost-ball-metalness: 0.0;

                --three-contact-caps-color: darkorange;
                --three-contact-caps-roughness: 0.2;
                --three-contact-caps-metalness: 0.1;

                --three-aim-line-color: linen;
                --three-contact-line-color: darkorange;
                --three-pocket-line-color: limegreen;
                --three-centers-box-color: var(--three-pocket-line-color);

                --three-ambient-light-color: darkgray;
                --three-ambient-light-intensity: 1.0;
                --three-overhead-light-color: white;
                --three-overhead-light-intensity: 0.7;
                --three-player-light-color: white;
                --three-player-light-intensity: 0.4;

                /*
                 * Values assigned below don't have to be associated with the dimensions of
                 * a real pool table. Instead, the table's length and width are defined in
                 * "ball radius" units.
                 *
                 * NOTE - using calc() here might be tempting, but it's a CSS function that
                 * won't work everywhere in this application.
                 */

                --three-ball-radius: 1;                 /* == minimum z for player camera */
                --three-table-length: 32;               /* == 16 balls long */
                --three-table-width: 16;                /* == 8 balls wide */

                /*
                 * Initial Settings - CSS variables with names that start with "--initial-"
                 * are used during initialization, primarily to configure elements, like
                 * sliders or checkboxes. Take a look at the initializeElements() function
                 * if you want to see exactly how these CSS variables are processed.
                 *
                 * Everything that follows the "--initial-" prefix, up to an underscore, is
                 * assumed to be an id that's eventually assigned to a GUI element (e.g., a
                 * slider or checkbox). That underscore is a separator and whatever follows
                 * it (up to a ':') is assumed to be the name of a property that belongs to
                 * the element associated with that id. The whitespace trimmed string that
                 * follows the colon is the value that's assigned to that property.
                 *
                 * NOTE - a property name that begins with an underscore (i.e., there were
                 * two or more consecutive underscores in the CSS variable name) is assumed
                 * to be the name of a property that doesn't currently exist. A leading '_'
                 * in that name also means it should appear at or near the beginning of any
                 * dump of that element, which can be useful during debugging.
                 *
                 * NOTE - the order of the definitions in each "block" of variables could
                 * make a difference (e.g., min and max probably should be assigned before
                 * value), but there's a validation step in initializeElements() that looks
                 * for unexpected modifications to these values and throws an error if any
                 * are found.
                 *
                 * NOTE - values assigned to CSS variables that end in "_label_descriptor"
                 * are parsed by the syncLabelTo() function. What's recognized is limited
                 * and currently just includes "this", which resolves to the element that
                 * owns the "_label_descriptor" property, and abs() when we want to make
                 * sure the string displayed in the associated label doesn't start with a
                 * negative sign.
                 */

                --initial-aim-line-checkbox_checked: true;
                --initial-aim-line-extended-checkbox_checked: false;
                --initial-centers-box-checkbox_checked: false;
                --initial-contact-caps-checkbox_checked: true;
                --initial-contact-line-checkbox_checked: true;
                --initial-contact-line-extended-checkbox_checked: true;
                --initial-pocket-line-checkbox_checked: true;
                --initial-pocket-line-cloned-checkbox_checked: false;

                --initial-shot-angle-slider_min: -90;
                --initial-shot-angle-slider_max: 90;
                --initial-shot-angle-slider_value: 30;
                --initial-shot-angle-slider__label_id: "shot-angle-slider-value-label";
                --initial-shot-angle-slider__label_descriptor: "abs(this.value) + '°'";         /* this ==> shot-angle-slider */
                --initial-shot-angle-slider__stops: "-90, -49, -30, -14, 0, 14, 30, 49, 90";

                --initial-cb-position-slider_min: 0;
                --initial-cb-position-slider_max: 100;
                --initial-cb-position-slider_step: any;
                --initial-cb-position-slider_value: 16;

                --initial-ob-position-slider_min: 0;
                --initial-ob-position-slider_max: 100;
                --initial-ob-position-slider_step: any;
                --initial-ob-position-slider_value: 53;

                --initial-cb-transparency-slider_min: 0;
                --initial-cb-transparency-slider_max: 10;
                --initial-cb-transparency-slider_value: 2;
                --initial-cb-transparency-slider__material_name: cue_ball_material;             /* universe property name */

                --initial-ob-transparency-slider_min: 0;
                --initial-ob-transparency-slider_max: 10;
                --initial-ob-transparency-slider_value: 2;
                --initial-ob-transparency-slider__material_name: object_ball_material;          /* universe property name */

                --initial-gb-transparency-slider_min: 0;
                --initial-gb-transparency-slider_max: 10;
                --initial-gb-transparency-slider_value: 6;
                --initial-gb-transparency-slider__material_name: ghost_ball_material;           /* universe property name */

                --initial-height-slider-view-top_min: 0;
                --initial-height-slider-view-top_max: 100;
                --initial-height-slider-view-top_value: 70;
                --initial-height-slider-view-top__min_zoom: 0.5;
                --initial-height-slider-view-top__max_zoom: 4;

                --initial-shift-slider-view-top_min: -100;
                --initial-shift-slider-view-top_max: 100;
                --initial-shift-slider-view-top_value: 0;
                --initial-shift-slider-view-top_disabled: true;

                --initial-height-slider-view-player_min: 0;
                --initial-height-slider-view-player_max: 100;
                --initial-height-slider-view-player_value: 25;
                --initial-height-slider-view-player__min_z: 1;
                --initial-height-slider-view-player__max_z: 30;

                --initial-shift-slider-view-player_min: -100;
                --initial-shift-slider-view-player_max: 100;
                --initial-shift-slider-view-player_value: 0;
                --initial-shift-slider-view-player__max_shift: 1;
                --initial-shift-slider-view-player__label_id: "shift-slider-value-label";
                --initial-shift-slider-view-player__label_descriptor: "this.value";

                --initial-view-select_value: view-top;
            }

            * {
                box-sizing: border-box;

                /*
                 * Disable double/triple click text highlighting.
                 */

                user-select: none;
                -webkit-user-select: none;

                text-size-adjust: none;
                -moz-text-size-adjust: none;
                -webkit-text-size-adjust: none;
            }

            body {
                display: grid;
                margin: 0;
                padding: 0;
                overflow: hidden;
                height: 100dvh;
                grid-template-columns: 320px 1fr;
                grid-template-rows: 1fr auto;

                background-color: var(--background-color);
                color: var(--foreground-color);

                font-family: var(--font-family);
                font-weight: var(--font-weight);
                font-size: var(--font-size);
            }

            /*
             * Form element rules.
             */

            button, select, input, textarea {
                font: inherit;
            }

            input[type="range"] {
                display: block;
                width: 100%;
            }

            /*
             * Panels - for top-level browser window organization.
             */

            #control-panel {
                display: flex;
                grid-column: 1;
                grid-row: 1;
                height: 100%;
                flex-direction: column;
                overflow-y: auto;
                min-height: 0;

                background-color: var(--empty-color);

                border-color: var(--panel-border-color);
                border-width: var(--panel-border-width);
                border-style: var(--panel-border-style);

                padding-left: var(--panel-padding);
                padding-right: var(--panel-padding);
                row-gap: var(--panel-padding);
            }

            #canvas-panel {
                grid-column: 2;
                grid-row: 1;
                height: 100%;
                position: relative;
                min-width: 0;
                min-height: 0;

                background-color: var(--background-color);

                border-color: var(--panel-border-color);
                border-width: var(--panel-border-width);
                border-style: var(--panel-border-style);
            }

            #footer-panel {
                display: flex;
                grid-column: 1 / span 2;
                grid-row: 2;
                height: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                z-index: 10;

                background-color: var(--background-color);

                border-color: var(--panel-border-color);
                border-width: var(--panel-border-width);
                border-style: var(--panel-border-style);

                padding: var(--panel-padding);
            }

            /*
             * Control sub-panels - for checkboxes, sliders, labels, and anything else that
             * ends up in the control-panel.
             */

            .control-group {
                width: 100%;
                flex: none;

                color: var(--foreground-color);
                background-color: var(--background-color);

                border-color: var(--border-color);
                border-width: var(--panel-border-width);
                border-style: inset;

                padding: var(--panel-padding);
            }

            .control-group:has(input:disabled:not([hidden])) {
                opacity: var(--disabled-opacity);
            }

            .control-group:has(input:disabled:not([hidden])) .control-group-title span:last-child {
                visibility: hidden;
            }

            .control-group-title {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                touch-action: none;

                border-bottom: 1px dashed var(--title-color);
                padding-bottom: var(--panel-padding);
                margin-bottom: 10px;

                color: var(--title-color);
                font-size: var(--font-size-title);
            }

            .control-group-container {
                align-items: center;
                padding-left: 10px;
                padding-right: 10px;
                margin-bottom: var(--panel-padding);
            }

            .control-flex-start-row {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: flex-start;

                white-space: nowrap;
                margin-bottom: var(--panel-padding);
            }

            .control-space-between-row {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                touch-action: none;
            }

            .control-indented-row {
                position: relative;
                left: 20px;
            }

            .active-drag {
                background-color: var(--drag-background-color);
            }

            /*
             * These are used to force sliders that control the cameras associated with the
             * selected "view" to occupy the same "space" in the control panel. The sliders
             * in the group that aren't associated with the current view are hidden whenever
             * the view changes, so only one slider in the group will be displayed.
             */

            .slider-group {
                display: grid;
            }

            .slider-group > input {
                grid-area: 1 / 1;
                width: 100%;
                height: 100%;
                margin: 0;
            }

            .slider-group > input[hidden] {
                display: none !important;
            }

            /*
             * Custom help text rules - they all start with the "help-" prefix and are only
             * used to build the help text tabbed panel.
             */

            #help-modal {
                display: flex;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100dvh;
                position: fixed;
                justify-content: center;
                align-items: flex-start;
                z-index: 100;

                background-color: rgba(0, 0, 0, calc(1.0 - var(--disabled-opacity)));
                padding-top: 2vh;

                opacity: var(--hidden-opacity);
                pointer-events: none;
            }

            #help-modal.modal-open {
                opacity: var(--enabled-opacity);
                pointer-events: auto;
            }

            #help-content {
                display: flex;
                width: 900px;
                max-width: 90vw;
                text-align: left;
                flex-direction: column;

                background-color: var(--help-background-color);
                color: var(--help-foreground-color);
                border-color: var(--help-panel-border-color);
                border-width: var(--help-panel-border-width);
                border-style: inset;
                padding: 20px;

                font-family: var(--help-font-family);
                font-weight: var(--help-font-weight);
                font-size: var(--help-font-size);
            }

            #help-tab-container {
                display: flex;
                gap: 2px;
                justify-content: start;

                background-color: var(--help-background-color);
                border-bottom: 1px solid var(--help-tab-foreground-color);
                margin-bottom: 10px;
            }

            #help-panel-container {
                text-align: left;
                max-height: 60dvh;
                overflow-y: auto;

                width: 100%;
                padding: 5px 0;
            }

            #help-footer-panel {
                display: grid;
                width: 100%;
                justify-content: center;

                margin-top: 25px;
            }

            .help-tab-button {
                border: 1px solid transparent;
                border-bottom: none;
                padding: 8px 12px;

                background-color: var(--help-background-color);
                color: color-mix(in srgb, var(--help-tab-foreground-color) 80%, black);

                font-family: var(--help-font-family);
                font-weight: var(--help-font-weight);
                font-size: var(--help-font-size-title);
            }

            .help-tab-button:hover {
                color: var(--help-tab-foreground-color);
            }

            .help-tab-button.active-tab {
                position: relative;
                top: 1px;
                border-top: 2px solid var(--help-tab-foreground-color);
                border-left: 2px solid var(--help-tab-foreground-color);
                border-right: 2px solid var(--help-tab-foreground-color);

                background-color: var(--help-background-color);
                color: var(--help-tab-foreground-color);
            }

            .help-tab-panel {
                display: none;
            }

            .help-tab-panel.active-panel {
                display: block;
            }

            /*
             * Color classes - they're currently only used to apply colors to a few words
             * or abbreviations in the HTML help text. Guarantees that CSS color variable
             * changes are reflected in the displayed HTML help text.
             */

            .color-of-CB {
                color: var(--three-cue-ball-color);
            }

            .color-of-OB {
                color: var(--three-object-ball-color);
            }

            .color-of-GB {
                color: var(--three-ghost-ball-color);
            }

            .color-of-aim-line {
                color: var(--three-aim-line-color);
            }

            .color-of-centers-box {
                color: var(--three-centers-box-color);
            }

            .color-of-contact-caps {
                color: var(--three-contact-caps-color);
            }

            .color-of-contact-line {
                color: var(--three-contact-line-color);
            }

            .color-of-pocket-line {
                color: var(--three-pocket-line-color);
            }
        </style>
    </head>

    <body>
        <div id="control-panel">
            <div class="control-group">
                <div class="control-group-title">
                    <span>Visual Aids</span>
                    <span></span>
                </div>
                <div id="visual-aids-box" class="control-group-container">
                    <div class="control-flex-start-row">
                        <input type="checkbox" id="aim-line-checkbox"><label for="aim-line-checkbox">Aim<span style="color: var(--three-aim-line-color);">&nbsp;Line</span></label>
                    </div>
                    <div class="control-flex-start-row control-indented-row">
                        <input type="checkbox" id="aim-line-extended-checkbox"><label for="aim-line-extended-checkbox">Extended</label>
                    </div>

                    <div class="control-flex-start-row">
                        <input type="checkbox" id="contact-line-checkbox"><label for="contact-line-checkbox">Contact<span style="color: var(--three-contact-line-color);">&nbsp;Line</span></label>
                    </div>
                    <div class="control-flex-start-row control-indented-row">
                        <input type="checkbox" id="contact-line-extended-checkbox"><label for="contact-line-extended-checkbox">Extended</label>
                    </div>

                    <div class="control-flex-start-row">
                        <input type="checkbox" id="pocket-line-checkbox"><label for="pocket-line-checkbox">Pocket<span style="color: var(--three-pocket-line-color);">&nbsp;Line</span></label>
                    </div>
                    <div class="control-flex-start-row control-indented-row">
                        <input type="checkbox" id="pocket-line-cloned-checkbox"><label for="pocket-line-cloned-checkbox">Cloned</label>
                    </div>

                    <div class="control-flex-start-row">
                        <input type="checkbox" id="centers-box-checkbox"><label for="centers-box-checkbox">Centers<span style="color: var(--three-centers-box-color);">&nbsp;Box</span></label>
                    </div>

                    <div class="control-flex-start-row">
                        <input type="checkbox" id="contact-caps-checkbox"><label for="contact-caps-checkbox">Contact<span style="color: var(--three-contact-caps-color);">&nbsp;Caps</span></label>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <div id="shot-angle-slider-title" class="control-group-title">
                    <span>Shot Angle</span>
                    <span id="shot-angle-slider-value-label" style="font-size: var(--font-size);"></span>
                </div>
                <div id="shot-angle-slider-box" class="control-group-container">
                    <div id="shot-angle-slider-box-labels" class="control-space-between-row">
                        <span>Left</span>
                        <span>Right</span>
                    </div>
                    <input type="range" id="shot-angle-slider">
                </div>
            </div>

            <div class="control-group">
                <div class="control-group-title">
                    <span>Position</span>
                    <span></span>
                </div>
                <div id="cb-position-slider-box" class="control-group-container">
                    <div id="cb-position-slider-box-labels" class="control-space-between-row">
                        <span style="color: var(--three-cue-ball-color);">CB</span>
                        <span></span>
                    </div>
                    <input type="range" id="cb-position-slider">
                </div>

                <div id="ob-position-slider-box" class="control-group-container">
                    <div id="ob-position-slider-box-labels" class="control-space-between-row">
                        <span style="color: var(--three-object-ball-color);">OB</span>
                        <span></span>
                    </div>
                    <input type="range" id="ob-position-slider">
                </div>
            </div>

            <div class="control-group">
                <div class="control-group-title">
                    <span>Transparency</span>
                    <span></span>
                </div>
                <div id="cb-transparency-slider-box" class="control-group-container">
                    <div id="cb-transparency-slider-box-labels" class="control-space-between-row">
                        <span style="color: var(--three-cue-ball-color);">CB</span>
                        <span></span>
                    </div>
                    <input type="range" id="cb-transparency-slider">
                </div>
                <div id="ob-transparency-slider-box" class="control-group-container">
                    <div id="ob-transparency-slider-box-labels" class="control-space-between-row">
                        <span style="color: var(--three-object-ball-color);">OB</span>
                        <span></span>
                    </div>
                    <input type="range" id="ob-transparency-slider">
                </div>
                <div id="gb-transparency-slider-box" class="control-group-container">
                    <div id="gb-transparency-slider-box-labels" class="control-space-between-row">
                        <span style="color: var(--three-ghost-ball-color);">GB</span>
                        <span></span>
                    </div>
                    <input type="range" id="gb-transparency-slider">
                </div>
            </div>

            <div class="control-group">
                <div class="control-group-title">
                    <span>Camera Height</span>
                    <span></span>
                </div>
                <div id="height-slider-box" class="control-group-container">
                    <div id="height-slider-box-labels" class="control-space-between-row">
                        <span>Down</span>
                        <span>Up</span>
                    </div>
                    <div id="height-slider-group" class="slider-group">
                        <input type="range" id="height-slider-view-top">
                        <input type="range" id="height-slider-view-player" hidden>
                    </div>
                </div>
            </div>

            <div id="control-group-shift" class="control-group">
                <div id="shift-slider-title" class="control-group-title">
                    <span>Camera Shift</span>
                    <span id="shift-slider-value-label" style="font-size: var(--font-size);"></span>
                </div>
                <div id="shift-slider-box" class="control-group-container">
                    <div id="shift-slider-box-labels" class="control-space-between-row">
                        <span>Left</span>
                        <span>Right</span>
                    </div>
                    <div id="shift-slider-group" class="slider-group">
                        <input type="range" id="shift-slider-view-top">
                        <input type="range" id="shift-slider-view-player" hidden>
                    </div>
                </div>
            </div>
        </div>

        <div id="canvas-panel"></div>

        <div id="footer-panel">
            <button id="button-reset">Reset</button>

            <select id="view-select">
                <option value="view-top">Top View</option>

        <script type="module" data-name="CSS Globals Collector">
            window.app = window.app || {};

            //
            // This module builds an object named window.app.CSS_GLOBALS that's used to map
            // CSS global variable names to their values. It ends up being a straightforward
            // way to access them in our JavaScript code, but right now that JavaScript code
            // only needs the ones that start with --initial and --three.
            //
            // NOTE - using getComputedStyle() makes sure var() is resolved in our copy, but
            // it wouldn't help with calc().
            //

            window.app.CSS_GLOBALS = (() => {
                let map;
                let prop;
                let styles;

                //
                // Grabs everything in :root that starts with "--" and adds each name and its
                // value to map, which is eventually returned by the function and assigned to
                // window.app.CSS_GLOBALS.
                //

                map = {};
                styles = getComputedStyle(document.documentElement);

                for (prop of styles) {
                    if (prop.startsWith("--")) {

        <script type="module" data-name="ID To Element Mapper">
            window.app = window.app || {};

            //
            // This module builds an object (named window.app.ID_TO_ELEMENT) that's used to
            // map a string to the element that has that string as its id attribute. Means
            // one quick lookup can find the element that "owns" an id.
            //

            window.app.ID_TO_ELEMENT = (() => {
                let cache;
                let dom_ids;
                let element;
                let id;

                //
                // Finds all of the document elements with id attributes, stores those ids
                // in an array, and then uses that Array to build the ID_TO_ELEMENT map.
                //
                // NOTE - added "browser-window" as an id that can be used to attach events
                // to the browser window. Added to cache first to trigger an error if it's
                // ever used as an id.
                //

                cache = {
                    "browser-window": window,           // reserved "id" for the browser window
                };

                dom_ids = Array.from(document.querySelectorAll("[id]")).map(el => el.id).filter(id => id != null && id !== "");

                for (id of dom_ids) {
                    if ((element = document.getElementById(id)) != null) {
                        if (cache[id] === undefined) {
                            cache[id] = element;
                        } else {
                            throw new Error(`element id ${id} is used more than once`);
                        }
                    }
                }
                return(cache);
            })();
        </script>

        <script type="module" data-name="Application Event Activator">
            window.app = window.app || {};

            //
            // This module is responsible for attaching event listeners to eligible elements.
            // In this application "eligible element" means it exists as the value associated
            // with an id key string in the window.app.ID_TO_ELEMENT object.
            //

            window.app.attachListenerToEvents = (listener, id_to_events) => {
                let element;
                let events;
                let id;

                //
                // This is the function that the "Main Module" uses to initialize events. It
                // makes sure the listener function is called whenever certain events fire on
                // elements that are identified by their id strings. The id_to_events argument
                // maps id key strings to arrays that usually enumerate the event type strings
                // that the element is supposed to respond to.
                //
                // NOTE - right now this function is only called once, which means all of the
                // events this application has to deal with are routed through a single listener
                // function. If you're really trying to follow this stuff, look for that call
                // and the declaration of ID_TO_EVENTS in the "Main Module".
                //

                if (typeof listener === "function") {
                    if (id_to_events != null) {
                        for ([id, events] of Object.entries(id_to_events)) {
                            if ((element = window.app.ID_TO_ELEMENT[id]) != null) {
                                activateListener(listener, element, events);
                            } else {
                                throw new Error(`element id ${id} is not a recognized key in window.app.ID_TO_ELEMENT`);
                            }
                        }
                    }
                } else {
                    throw new Error(`the listener argument ${listener} is not a function`);
                }
            }

            function activateListener(listener, element, events) {
                let args;
                let entry;
                let index;
                let options;

                //
                // Walks through the events array and calls element.addEventListener() for each
                // event type string that's found. If an event type string is followed by an
                // object (that's not an array) it's included in the addEventListener() call
                // as the options argument.
                //
                // NOTE - nested arrays in events and the optional addEventListener() argument
                // are both supported here, even though neither feature is currently needed in
                // this application.
                //

                if (element != null && events !== null && Array.isArray(events)) {
                    for (index = 0; index < events.length; index++) {
                        if ((entry = events[index]) != null) {
                            if (typeof entry === "string") {    // it's the event type argument
                                args = [entry, listener];
                                if ((options = events[index+1]) != null) {      // peek at the next element
                                    if (typeof options === "object" && !Array.isArray(options)) {
                                        //
                                        // It's supposed to be the optional options argument that can
                                        // be handed to addEventListener() as its last argument. Take
                                        // a look at the MDN documentation of addEventListener() for
                                        // more details.
                                        //
                                        args.push(options);
                                        index++;
                                    }
                                }
                                element.addEventListener(...args);
                            } else if (Array.isArray(entry)) {
                                activateListener(listener, element, entry);
                            } else {
                                throw new Error(`event listener entry for element ${element} isn't a string or an array`);
                            }
                        }
                    }
                }
            }

            const CSS_GLOBALS = window.app.CSS_GLOBALS;

            window.app.buildTabbedHelpPanel = () => {
                let count;
                let element;
                let heading_color;
                let heading_font_size_large;
                let heading_font_size_small;
                let heading_margin_bottom;
                let help_panel_container;
                let help_tab_container;
                let index;
                let level_indent;
                let panel;
                let panels;
                let paragraph;
                let splash_panel;
                let stack;
                let tab_button;
                let tab_index;
                let tabs;

                //
                // Hands the TABBED_HELP_DESCRIPTION string to parseTabbedPanelDescription() and
                // then uses the array that's returned to build the help panel. Using a two step
                // process simplifies this function, reduces the error checking that has to be
                // done here, and means the parseTabbedPanelDescription() function could be used
                // by other applications.
                //

                level_indent = CSS_GLOBALS["--help-level-indent"] || "20px";
                heading_margin_bottom = CSS_GLOBALS["--help-heading-margin-bottom"] || "10px";
                heading_color = CSS_GLOBALS["--help-heading-foreground-color"] || "red";
                heading_font_size_large = CSS_GLOBALS["--help-font-size-title"] || "18px";
                heading_font_size_small = CSS_GLOBALS["--help-font-size"] || "16px";

                    if ((stack = window.app.parseTabbedPanelDescription(TABBED_HELP_DESCRIPTION)) != null) {

                        help_panel_container = window.app.ID_TO_ELEMENT["help-panel-container"];

                        // event listeners for the tab buttons are built.

                        // We use splash_panel to collect any text that precedes the first tab.
                        // Anything added to splash_panel will be displayed the first time the
                        // help tabbed panel is displayed. It's primarily a defensive move and
                        // doesn't really provide a new feature, because that same text could
                        // be displayed using a tab.
                        //

                        splash_panel = document.createElement("div");

                            switch (element.type) {

                                    //

                                    // it's sufficient for our purposes. Change it if you disagree.
                                    //

                                    // parseTabbedPanelDescription() detected at least one error and
                                    // wrote info about them to the console. This case gets to decide
                                    // what happens and since it runs during initialization throwing
                                    // an error should trigger the error handling that was installed
                                    // by the "Startup Error Handling" module.
                                    //

                                    // Currently ignored and element.value is empty, but it's not hard
                                    // to imagine eventually doing something useful.
                                    //
                                    break;

                                case "HEADING":
                                    switch (element.arg) {
                                        case "H":
                                            panel.innerHTML += `<h3 style="font-size: ${heading_font_size_large}; margin-bottom: ${heading_margin_bottom}; color: ${heading_color};">${element.value}</h3>`;
                                            break;

                                        case "h":
                                            panel.innerHTML += `<h4 style="font-size: ${heading_font_size_small}; margin-bottom: ${heading_margin_bottom}; color: ${heading_color};">${element.value}</h4>`;
                                            break;

                                        default:
                                            throw new Error(`internal error - unimplemented heading argument ${element.arg}`);
                                            break;
                                    }

                                    // Nothing we need to do here. It's a record of a text indentation
                                    // level change that the parser left on the stack. The parser could
                                    // easily remove them as soon as the level is consumed by the next

                                    // for now anyway, means those changes can be implemented without
                                    // affecting this function.
                                    //

                                    // <br>, to generate an appropriate number of empty lines. If the

                                    // code probably needs to make sure
                                    //
                                    //     panel.innerHTML += "<br>";
                                    //

                                    panel = document.createElement("div");
                                    panel.className = (tab_index === 0) ? "help-tab-panel active-panel" : "help-tab-panel";

                                    help_panel_container.appendChild(panel);

                                    panels.push(panel);

                //

                            max_y = 0.5 * this.table_length - 2 * this.ball_diameter;
                            ratio = (Number(target.value) - Number(target.min)) / (Number(target.max) - Number(target.min));
                            gb_y = min_y + ratio * (max_y - min_y);

                            angle_rad = THREE.MathUtils.degToRad(Number(shot_angle_slider.value));
                            ob_x = this.ball_diameter * Math.sin(angle_rad);
                            ob_y = gb_y + this.ball_diameter * Math.cos(angle_rad);

                            this.ghost_ball.position.set(0, gb_y, this.ball_radius);
                            this.object_ball.position.set(ob_x, ob_y, this.ball_radius);
                            this.view_player_camera.lookAt(this.view_player_camera.position.x, gb_y, this.ball_radius);
                            this.syncLines();
                            break;

                        case "pocket-line-checkbox":
                            this.pocket_line.visible = target.checked;
                            break;

                        case "pocket-line-cloned-checkbox":
                            this.pocket_line_cloned.visible = target.checked;
                            break;

                        case "shift-slider-view-player":
                            ratio = Number(target.value) / Number(target.max);

                        case "shot-angle-slider":

                    case "canvas-panel":
                        if (event.type === "wheel") {
                            if ((target = handleSliderEvent(event, "height-slider-" + ID_TO_ELEMENT["view-select"].value)) != null) {
                                THREE_UNIVERSE.syncUniverseTo(target);
                            }
                        } else if ((target = THREE_UNIVERSE.handleCanvasDrag(event)) != null) {
                            THREE_UNIVERSE.syncUniverseTo(target);
                            syncLabelTo(target);
                        }
                        break;

                    case "height-slider-box":
                    case "height-slider-box-labels":
                    case "shift-slider-box":
                    case "shift-slider-box-labels":
                    case "shift-slider-title":
                        if ((target = handleSliderEvent(event, id.replace(/-(box|box-labels|title)$/, "") + "-" + ID_TO_ELEMENT["view-select"].value)) != null) {
                            THREE_UNIVERSE.syncUniverseTo(target);
                        }
                        break;

                    case "help-modal-close":
                        ID_TO_ELEMENT["help-modal"].classList.remove("modal-open");
                        break;

                    case "help-modal-open":
                        ID_TO_ELEMENT["help-modal"].classList.add("modal-open");
                        break;

                    case "cb-position-slider":
                    case "cb-position-slider-box":
                    case "cb-position-slider-box-labels":
                    case "cb-transparency-slider":
                    case "cb-transparency-slider-box":
                    case "cb-transparency-slider-box-labels":
                    case "gb-transparency-slider":
                    case "gb-transparency-slider-box":
                    case "gb-transparency-slider-box-labels":
                    case "height-slider-view-top":
                    case "height-slider-view-player":
                    case "ob-position-slider":
                    case "ob-position-slider-box":
                    case "ob-position-slider-box-labels":
                    case "ob-transparency-slider":
                    case "ob-transparency-slider-box":
                    case "ob-transparency-slider-box-labels":
                    case "shift-slider-view-player":
                    case "shot-angle-slider":
                    case "shot-angle-slider-box":
                    case "shot-angle-slider-box-labels":
                    case "shot-angle-slider-title":
                        if ((target = handleSliderEvent(event, id.replace(/-(box|box-labels|title)$/, ""))) != null) {
                            THREE_UNIVERSE.syncUniverseTo(target);
                        }
                        break;

                    case "view-select":
                        if ((target = handleSelectEvent(event, id)) != null) {
                            THREE_UNIVERSE.syncUniverseTo(target);
                        }
                        break;

                    default:
                        if (event.currentTarget === window) {
                            if ((target = handleWindowEvent(event)) != null) {
                                THREE_UNIVERSE.syncUniverseTo(target, event);
                            }
                        } else {
                            console.warn("**** Event %o has not been implemented\n", event);
                        }
                        break;
                }
            }

            function handleCheckboxEvent(event, target_id) {
                let target;
                let updated;

                //
                // Handles events for the checkbox associated with target_id. If the checkbox
                // isn't disabled and the event is recognized, any label associated with the
                // checkbox is updated and the checkbox element is returned to the caller.
                //
                // NOTE - calling syncLabelTo() here is just for consistency with the other
                // event handlers because checkboxes don't currently use labels that display
                // their state.
                //

                updated = null;

                if ((target = ID_TO_ELEMENT[target_id]) != null) {
                    if (!target.disabled) {
                        switch (event.type) {
                            case "change":
                                updated = target;
                                break;

                            default:
                                throw new Error(`missing case for event type ${event.type}`);
                                break;
                        }
                        syncLabelTo(updated);
                    }
                } else {
                    throw new Error(`target id argument ${target_id} doesn't appear to be valid`);
                }

                return(updated);
            }

            function handleSelectEvent(event, target_id) {
                let direction;
                let index;
                let length;
                let target;
                let updated;

                //
                // Handles events for the select element associated with target_id. Standard
                // selection changes and mouse wheel rotation (which cycles through the menu
                // options) are both supported. If the element isn't disabled and the event
                // is recognized, any associated label is updated and the select element is
                // returned to the caller.
                //

                updated = null;

                if ((target = ID_TO_ELEMENT[target_id]) != null) {
                    if (!target.disabled) {
                        switch (event.type) {
                            case "change":
                                updated = target;
                                break;

                            case "wheel":
                                length = target.options.length;
                                index = target.selectedIndex;
                                direction = (Math.sign(event.deltaY) < 0) ? 1 : -1;     // standardize scroll direction
                                target.selectedIndex = (index + (direction < 0 ? length - 1 : 1)) % length;
                                updated = target;
                                break;

                            default:
                                throw new Error(`missing case for event type ${event.type}`);
                                break;
                        }
                        syncLabelTo(updated);
                    }
                } else {
                    throw new Error(`target id argument ${target_id} doesn't appear to be valid`);
                }

                return(updated);
            }

            function handleSliderEvent(event, target_id) {
                let current_target;
                let current_value;
                let delta_x;
                let direction;
                let max;
                let min;
                let next_value;
                let step;
                let stops;
                let target;
                let threshold;
                let updated;

                //
                // Handles events for the slider associated with target_id. Standard slider
                // adjustments, mouse wheel rotation, and horizontal pointer dragging on the
                // slider's title or label row are supported. If the slider's value changes,
                // any label associated with the slider is updated and the slider element is
                // returned to the caller.
                //
                // NOTE - wheel and pointer drag events that fire on a slider's title element
                // step through the preset values in target._stops (when defined) instead of
                // using the slider's step attribute. If target._stops is a string (e.g., when
                // it's initialized from :root), it's converted into a sorted array of numbers
                // the first time it's used.
                //

                updated = null;

                if ((target = ID_TO_ELEMENT[target_id]) != null) {
                    if (!target.disabled) {
                        current_target = event.currentTarget;
                        direction = 0;

                        switch (event.type) {
                            case "change":
                            case "input":
                                updated = target;
                                break;

                            case "pointerdown":
                                if (event.button === 0) {
                                    current_target._drag_start_x = event.clientX;
                                    current_target.setPointerCapture(event.pointerId);
                                    current_target.classList.add("active-drag");
                                }
                                break;

                            case "pointermove":
                                if (current_target._drag_start_x != null) {
                                    if (current_target.id.endsWith("-title")) {
                                        threshold = Number(CSS_GLOBALS["--slider-title-drag-threshold"]) || 25;
                                    } else {
                                        threshold = Number(CSS_GLOBALS["--slider-step-drag-threshold"]) || 8;
                                    }
                                    delta_x = event.clientX - current_target._drag_start_x;
                                    if (Math.abs(delta_x) >= threshold) {
                                        direction = Math.sign(delta_x);
                                        current_target._drag_start_x += direction * threshold;
                                    }
                                }
                                break;

                            case "pointercancel":
                            case "pointerup":
                                if (current_target._drag_start_x != null) {
                                    current_target._drag_start_x = null;
                                    current_target.classList.remove("active-drag");
                                    if (current_target.hasPointerCapture(event.pointerId)) {
                                        current_target.releasePointerCapture(event.pointerId);
                                    }
                                }
                                break;

                            case "wheel":
                                direction = (Math.sign(event.deltaY) < 0) ? 1 : -1;    // standardize scroll direction
                                break;

                            default:
                                throw new Error(`missing case for event type ${event.type}`);
                                break;
                        }

                        if (direction !== 0) {
                            current_value = parseFloat(target.value);
                            min = parseFloat(target.min);
                            max = parseFloat(target.max);
                            next_value = current_value;

                            if (current_target.id.endsWith("-title") && target._stops != null) {
                                if (typeof target._stops === "string") {
                                    target._stops = target._stops
                                        .replace(/^["']|["']$/g, "")
                                        .split(/[\s,]+/)
                                        .filter(s => s !== "")
                                        .map(Number)
                                        .sort((a, b) => a - b);
                                }
                                stops = target._stops;
                                if (direction > 0) {
                                    next_value = stops.find(s => s > current_value) ?? current_value;
                                } else {
                                    next_value = stops.findLast(s => s < current_value) ?? current_value;
                                }
                                next_value = Math.min(Math.max(next_value, min), max);
                            } else {
                                step = parseFloat(target.step) || 1;
                                next_value = Math.min(Math.max(current_value + (direction * step), min), max);
                            }

                            if (current_value !== next_value) {
                                target.value = next_value;
                                updated = target;
                            }
                        }
                        syncLabelTo(updated);
                    }
                } else {
                    throw new Error(`target id argument ${target_id} doesn't appear to be valid`);
                }

                return(updated);
            }

            function handleWindowEvent(event) {
                let updated;

                //
                // Very limited right now, but I suppose there's a chance we'll eventually do
                // more here.
                //

                updated = null;

                if (event.currentTarget === window) {
                    switch (event.type) {
                        case "resize":
                            updated = ID_TO_ELEMENT["canvas-panel"];
                            break;

                        default:
                            throw new Error(`missing case for window event type ${event.type}`);
                            break;
                    }
                } else {
                    console.error("event.currentTarget %o is not valid", event.currentTarget);
                    throw new Error();
                }

                return(updated);
            }

            function initializeElements(validate = false) {
                let attr;
                let element;
                let id;
                let index;
                let initialized;
                let key;
                let labeled;
                let tokenizer;
                let tokens;
                let value;

                //
                // This function looks through CSS_GLOBALS, which must have already been built,
                // to find all the properties (i.e., the ones that match the tokenizer regular
                // expression) that are supposed to be set during initialization or after the
                // Reset button is pressed. Right now the only ones we're looking for have keys
                // that start with the prefix "--initial-" and include at least one underscore
                // before the last character in the key.
                //
                // As an example, suppose one of the :root entries that ended up in CSS_GLOBALS
                // looked like
                //
                //     --initial-an-element-id_qwert: 30;
                //
                // then after the tokenizer regex splits the key up into tokens "an-element-id"
                // is assigned to id, "qwert" is assigned to attr, and "30" is assigned to value.
                // After that, ID_TO_ELEMENT is used to map id to the targeted element and then
                // value is assigned to that element's attr property. Now suppose the single
                // underscore is replaced by two, as in
                //
                //     --initial-an-element-id__qwert: 30;
                //
                // then the first underscore is the separator, but the second one is included in
                // the value assigned to attr, so "_qwert" is the name of the element's property
                // that ends up being set to 30.
                //
                // NOTE - decided to make the tokenizer a bit more general than necessary, just
                // so we can notice some obvious "mistakes" and put out a decent error message.
                //

                initialized = [];
                labeled = {};
                tokenizer = /^(--initial([^a-zA-Z0-9]))([a-zA-Z][a-zA-Z0-9-]*[a-zA-Z0-9])_([a-z_][a-zA-Z0-9_]+)$/;

                for (key of Object.keys(CSS_GLOBALS)) {
                    if ((tokens = tokenizer.exec(key)) != null) {
                        if (tokens[2] === "-") {                // validate in first separator
                            id = tokens[3];
                            attr = tokens[4];
                            if ((element = ID_TO_ELEMENT[id]) != null) {
                                switch (CSS_GLOBALS[key]) {
                                    case "false":
                                        value = false;
                                        break;

                                    case "true":
                                        value = true;
                                        break;

                                    default:
                                        value = CSS_GLOBALS[key];
                                        break;
                                }
                                element[attr] = value;
                                if (attr === "_label_descriptor" || attr === "_label_id") {
                                    //
                                    // These are collected in labeled and eventually all of
                                    // them will be synced to their labels.
                                    //
                                    if (labeled[id] == null) {
                                        labeled[id] = element;
                                    }
                                }
                                if (validate) {
                                    initialized.push(element, attr, value);
                                }
                            } else {
                                throw new Error(`key ${key} doesn't contain an id that's recognized`);
                            }
                        } else {
                            throw new Error(`key ${key} starts with an invalid prefix ${tokens[1]}`);
                        }
                    }
                }

                if (validate) {                 // for emphasis - the test isn't necessary
                    for (index = 0; index < initialized.length; index += 3) {
                        element = initialized[index];
                        attr = initialized[index+1];
                        value = initialized[index+2];
                        if (element[attr] !== value) {
                            throw new Error(`initialization mismatch: ${element.id}[${attr}]=${element[attr]} (expected ${value})`);
                        }
                    }
                }

                //
                // The elements in labeled are all supposed to be associated with a label
                // and each one must have fields named _label_id and _label_descriptor. We
                // make sure both exist before calling syncLabelTo(), because that function
                // can be called with any element - not just the ones that are explicitly
                // associated with a label.
                //
                // NOTE - syncLabelTo() does handle important error checking that we don't
                // want to duplicate here (e.g., parsing whatever's in _label_descriptor).
                //

                for ([id, element] of Object.entries(labeled)) {
                    if (element._label_id != null) {
                        if (element._label_descriptor != null) {
                            syncLabelTo(element);
                        } else {
                            console.error("required _label_descriptor field is missing in element %o", element);
                            throw new Error();
                        }
                    } else {
                        console.error("required _label_id field is missing in element %o", element);
                        throw new Error();
                    }
                }

                //
                // If THREE_UNIVERSE has been assembled, which will happen after the Reset
                // button is pressed, make sure the Three.js universe is configured.
                //

                if (THREE_UNIVERSE.assembled) {
                    THREE_UNIVERSE.syncUniverse();
                }
            }

            function run() {
                //
                // Called at the end of this module to initialize and start the application. It
                // makes sure the objects built by earlier modules exist, calls the functions
                // that finish initializing the application, and then calls afterInitialize()
                // to remove the temporary error listener installed by the first module.
                //
                // NOTE - initializeElements() must run before assembleUniverse() is called so
                // the GUI elements are configured when assembleUniverse() syncs the universe.
                //

                if (THREE != null) {
                    if (ID_TO_ELEMENT != null) {
                        if (CSS_GLOBALS != null) {
                            initializeElements(true);

                            window.app.attachListenerToEvents(eventListener, ID_TO_EVENTS);
                            window.app.buildTabbedHelpPanel();
                            window.app.assembleUniverse(THREE_UNIVERSE, animate, "canvas-panel");
                            window.app.afterInitialize();
                        } else {
                            throw new Error("problem building CSS_GLOBALS - this is an unexpected error");
                        }
                    } else {
                        throw new Error("problem building ID_TO_ELEMENT - check for duplicate element ids");
                    }
                } else {
                    throw new Error("problem downloading Three.js - check your network connection or the module's integrity hash");
                }
            }

            function syncLabelTo(owner) {
                let builtin;
                let descriptor;
                let key;
                let label;
                let label_descriptor;
                let label_id;
                let label_text;
                let str;
                let tokenizer;
                let tokens;

                //
                // Handles elements, like sliders, that are explicitly associated with a label
                // that's supposed to display the element's current "value". Right now that only
                // happens when the element has "_label_id" and "_label_descriptor" keys that
                // were both created when initializeElements() was called the first time (i.e.,
                // when the application started running).
                //
                // NOTE - the tokenizer regular expression seems to work, but it's brittle and
                // the code that handles matched tokens assumes it knows their correct indices.
                // Change that regular expression, even a little, and you'll probably have to
                // take a close look at the code in the while loop.
                //
                // NOTE - plenty of room left for error checks, and because this function also
                // runs during initialization any mistakes should be caught very early.
                //

                tokenizer = /^[ \t]*((["'])([\s\S]*)?\2|this[.]([A-Za-z0-9_]+)|([a-z]+)[\(]this[.]([A-Za-z0-9_]+)[\)])[ \t]*[+]?[ \t]*(.*)$/;

                if (owner != null) {
                    if ((label_id = owner._label_id) != null) {
                        label_id = label_id.replace(/^["']|["']$/g, "").trim();
                        if ((label = ID_TO_ELEMENT[label_id]) != null) {
                            if ((label_descriptor = owner._label_descriptor) != null) {
                                label_text = "";
                                descriptor = label_descriptor.replace(/^["']|["']$/g, "").trim();
                                while (descriptor != null && descriptor !== "") {
                                    if ((tokens = tokenizer.exec(descriptor)) != null) {
                                        if ((str = tokens[3]) != null) {
                                            label_text += str;
                                        } else if ((key = tokens[4]) != null) {
                                            label_text += owner[key];           // handles "this.key"
                                        } else if ((builtin = tokens[5]) != null) {
                                            if ((key = tokens[6]) != null) {
                                                //
                                                // It's a builtin - the only one we currently need is abs(),
                                                // but more could be added.
                                                //
                                                switch (builtin) {
                                                    case "abs":
                                                        if (owner[key] !== undefined) {
                                                            label_text += Math.abs(Number(owner[key]));
                                                        } else {
                                                            console.error("key %s is not defined in owner %o", key, owner);
                                                            throw new Error();
                                                        }
                                                        break;

                                                    default:
                                                        throw new Error(`builtin ${builtin} hasn't been implemented`);
                                                        break;
                                                }
                                            } else {
                                                throw new Error(`problem extracting the builtin's argument from ${label_descriptor}`);
                                            }
                                        } else {
                                            throw new Error(`problem extracting tokens from the active descriptor ${descriptor}`);
                                        }
                                        descriptor = tokens[7];
                                    } else {
                                        console.error("problem parsing the active label descriptor %s for %o", descriptor, owner);
                                        throw new Error();
                                        descriptor = null;              // force loop to stop if the throw is removed
                                    }
                                }
                                label.innerText = label_text;
                            }
                        } else {
                            throw new Error(`label id ${label_id} isn't assigned to an existing element`);
                        }
                    }
                }
            }

            //
            // Script start
            //

            run();
        </script>
    </body>
</html>
